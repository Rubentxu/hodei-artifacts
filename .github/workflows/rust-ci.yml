name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# The suites are segmented by what they need, not by how long they take:
#
#   fast           unit tests and contract tests that need neither the embedded
#                  database nor a spawned process.
#   integration    the tests that use the embedded database, including the ones
#                  that drive the operator commands against it.
#   infrastructure the tests that boot the application, restart it, or run its
#                  binary as a process.
#
# Each suite runs exactly once, in its own step, and each step records its
# duration in the job summary. `tests/ci_suites.rs` reads this file and fails
# when a test target is missing from a suite or when a suite names a target
# that does not exist, so the segmentation cannot drift away from the tests.

jobs:
  # The fast gate. This is the job a pull request waits for: it answers the
  # question "does this change break the unit and contract tests?" without
  # paying for the suites that need infrastructure.
  fast:
    name: Fast suite (unit and contract)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Suite fast (unit and contract)
        id: suite-fast
        run: |
          started=$(date +%s)
          cargo test --workspace --lib --bins \
            --test authorization_isolation \
            --test ci_suites \
            --test hrn_parity \
            --test legacy_quarantine \
            --test module_tree || status=$?
          elapsed=$(( $(date +%s) - started ))
          echo "duration_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "### Suite fast (unit and contract): ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

  # The suites that need the embedded database and the ones that boot the
  # application. They start after the fast gate, so they reuse the compiled
  # artifacts it left in the cache instead of compiling the workspace again.
  integration:
    name: Integration suite (database)
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Suite integration (database)
        id: suite-integration
        run: |
          started=$(date +%s)
          cargo test --workspace \
            --test admin_surface \
            --test audit_events \
            --test http_contract \
            --test iam_account_index \
            --test iam_backfill \
            --test iam_policy_timestamps \
            --test iam_scope \
            --test playground_isolation \
            --test policy_circuits \
            --test repository_create \
            --test repository_durable \
            --test repository_read \
            --test schema_persistence || status=$?
          elapsed=$(( $(date +%s) - started ))
          echo "duration_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "### Suite integration (database): ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

  infrastructure:
    name: Infrastructure suite (boot and processes)
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Suite infrastructure (boot and processes)
        id: suite-infrastructure
        run: |
          started=$(date +%s)
          cargo test --workspace \
            --test binary_contract \
            --test bootstrap_integration \
            --test distribution_contract \
            --test production_auth \
            --test repository_restart_contract || status=$?
          elapsed=$(( $(date +%s) - started ))
          echo "duration_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "### Suite infrastructure (boot and processes): ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

  # nextest is opt-in: it runs the same workspace with per-test isolation, but
  # the RocksDB/binary suites need a single test thread to avoid contention.
  # Keep it off the PR critical path; run it manually when isolation matters.
  nextest-serial:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test (nextest, serial)
        run: cargo nextest run --workspace --no-fail-fast --test-threads=1
