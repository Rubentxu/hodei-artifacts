# Single-node Garage configuration for compose.external.yaml.
#
# Garage keeps `metadata_dir` (meta) and `data_dir` (data) on SEPARATE volumes.
# No secrets live here: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN are read from
# the environment (see compose.env.example).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
