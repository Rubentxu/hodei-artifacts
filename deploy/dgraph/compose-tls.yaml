# TLS override for the single Zero+Alpha lab (HSP-177).
#
# Usage (from deploy/dgraph):
#   TLS_DIR=tls-single NODES=dgraph-zero,dgraph-alpha,localhost,127.0.0.1 ./gen-certs.sh
#   head -c 32 /dev/urandom > secrets/hmac-secret
#   podman compose -f compose.yaml -f compose-tls.yaml up -d
#
# - `internal-port=true`: TLS also on the node<->node gRPC ports (Zero 5080,
#   Alpha 7080), so Alpha->Zero traffic is encrypted and verified.
# - `client-auth-type=VERIFYIFGIVEN`: clients are NOT forced to present a
#   certificate, but if they do it must chain to the lab CA. Plain-text
#   clients and clients that do not trust the lab CA are rejected.
# - Keys and certs live in ./tls-single (gitignored, generated by
#   gen-certs.sh); never commit them.
services:
  zero:
    command: >
      dgraph zero --my=dgraph-zero:5080 --wal=/dgraph-data/zero
      --telemetry "reports=false"
      --tls "ca-cert=/dgraph/tls/ca.crt; server-cert=/dgraph/tls/node.crt; server-key=/dgraph/tls/node.key; client-cert=/dgraph/tls/client.hodei-client.crt; client-key=/dgraph/tls/client.hodei-client.key; client-auth-type=VERIFYIFGIVEN; internal-port=true"
    volumes:
      - dgraph-zero-data:/dgraph-data
      - ./tls-single:/dgraph/tls:ro,z

  alpha:
    command: >
      dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080
      --postings=/dgraph-data/p --wal=/dgraph-data/w
      --acl "secret-file=/dgraph/secrets/hmac-secret; access-ttl=24h; refresh-ttl=72h; jwt-alg=HS256"
      --telemetry "reports=false"
      --tls "ca-cert=/dgraph/tls/ca.crt; server-cert=/dgraph/tls/node.crt; server-key=/dgraph/tls/node.key; client-cert=/dgraph/tls/client.hodei-client.crt; client-key=/dgraph/tls/client.hodei-client.key; client-auth-type=VERIFYIFGIVEN; internal-port=true"
    volumes:
      - dgraph-alpha-data:/dgraph-data
      - dgraph-backups:/dgraph-backups
      - ./secrets/hmac-secret:/dgraph/secrets/hmac-secret:ro,z
      - ./tls-single:/dgraph/tls:ro,z
