policiesRoot:
  post:
    tags:
      - Policies
    summary: Create a new policy
    operationId: createPolicy
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/policies.yaml#/CreatePolicyCommand'
    responses:
      '200':
        description: Policy created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/policies.yaml#/CreatePolicyResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '500':
        $ref: '../components/responses.yaml#/InternalError'