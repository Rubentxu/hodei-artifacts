# Mapa de paths: referencia a archivos por operación
#
# La consola del catálogo cuelga de `/api/v1`, que es donde el servicio
# monta la API. Los caminos vienen con el prefijo real para que quien
# los use llegue a la superficie que existe.
#
# v1 core
#
# El registro de repositorios cuelga de `/api/v1`, que es donde la API
# vive: el camino que se declara es el que el servicio sirve.
/api/v1/repositories: { $ref: './repositories.yaml#/repositoriesRoot' }
/v1/artifacts: { $ref: './artifacts.yaml#/artifactsRoot' }
/v1/artifacts/{id}: { $ref: './artifacts.yaml#/artifactById' }
/v1/search: { $ref: './search.yaml#/searchV1' }

# v1 users
/v1/users: { $ref: './users.yaml#/usersRoot' }
/v1/users/{id}/attributes: { $ref: './users.yaml#/usersAttributes' }

# v1 policies
/v1/policies: { $ref: './policies.yaml#/policiesRoot' }

# v2 ecosystems
/maven2/{groupId}/{artifactId}/{version}/{fileName}: { $ref: './maven.yaml#/download' }
/{packageName}: { $ref: './npm.yaml#/packageMeta' }
/{packageName}/-/{fileName}: { $ref: './npm.yaml#/tarball' }
/simple/{packageName}: { $ref: './pypi.yaml#/simpleIndex' }
/packages/{fileName}: { $ref: './pypi.yaml#/packageFile' }
/packages: { $ref: './pypi.yaml#/upload' }

# v2 auth
/auth/tokens: { $ref: './auth.yaml#/tokens' }
/auth/tokens/{tokenId}: { $ref: './auth.yaml#/tokenById' }

# La consola del catálogo: los repositorios, lo que se puede crear, la
# búsqueda, el detalle de un activo y las promociones.
/api/v1/catalog/repositories: { $ref: './console.yaml#/catalogRepositories' }
/api/v1/capabilities: { $ref: './console.yaml#/capabilities' }
/api/v1/search: { $ref: './console.yaml#/catalogSearch' }
/api/v1/packages/{repository}/{path}: { $ref: './console.yaml#/catalogPackage' }
/api/v1/promotions: { $ref: './console.yaml#/promotions' }
/api/v1/promotions/revoke: { $ref: './console.yaml#/promotionsRevoke' }
