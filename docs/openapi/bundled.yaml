        name:
          type: string
        version:
          type: string
        description:
          type: string
        main:
          type: string
        scripts:
          type: object
        dependencies:
          type: object
        devDependencies:
          type: object
        dist:
          type: object
          properties:
            tarball:
              type: string
              format: uri
            shasum:
              type: string
            integrity:
              type: string
    NpmMaintainer:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    NpmPackageMetadata:
      type: object
