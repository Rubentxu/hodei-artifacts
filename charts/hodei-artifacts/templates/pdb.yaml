{{- if and (not (include "hodei.usesRocksdb" .)) .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hodei.fullname" . }}
  labels:
    {{- include "hodei.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "hodei.selectorLabels" . | nindent 6 }}
{{- end }}
