# Default values: the graph profile, the only productive one (HSP-314 F2).
#
# The image runs RUN_MODE=dgraph: `[graph]` declares a Dgraph Alpha as the single
# metadata authority and the bytes live in S3. The API is stateless (no PVC, no
# RocksDB, no filesystem CAS) and fails closed while a backend is unreachable.
# The old standalone and rocksdb-garage profiles were removed with the embedded
# engine from the image.
#
# Not wired yet (HSP-314 F3): the investigation surface, the risk facts and the
# CVE reactor stay closed on this profile.
#
# See values-graph.yaml for an overlay with the in-cluster Dgraph.
# No secret value lives in this file: secrets are referenced by name only.
profile: graph

nameOverride: ""
fullnameOverride: ""

image:
  repository: hodei-artifacts-api
  # Empty tag falls back to .Chart.AppVersion. Prefer a digest in production.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2

# Maps to HODEI_<SECTION>__<KEY>; see docs/community/configuration.md.
config:
  server:
    port: 3000
  logging:
    level: info
    format: json
  # Public URL announced to clients. The service does NOT terminate TLS:
  # terminate it at the Ingress or load balancer and set an https URL here.
  publicBaseUrl: ""
  trustedProxies: []
  corsAllowedOrigins: []

# The Dgraph Alpha that is the metadata authority. With `dgraph.enabled` the
# endpoint is the in-cluster Alpha; otherwise `graph.endpoint` (host:port of the
# gRPC) is required. TLS is a written decision: declare the CA with it.
graph:
  endpoint: ""
  namespace: 0
  tls:
    enabled: true
    caCertPath: /etc/hodei/dgraph/ca.crt
    serverName: dgraph-alpha
  credentials:
    userid: groot
    # Existing Secret with the ACL password of the service account. Never inline.
    existingSecret: ""
    passwordKey: password

# S3 content backend.
s3:
  bucket: hodei-content
  # Empty means: in-cluster Garage when garage.enabled, else the AWS default.
  endpoint: ""
  region: ""
  tls: true
  # Existing Secret with the S3 credentials (keys below). Never inline.
  existingSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key

# Existing Secret with optional runtime secrets. Each key is optional.
secrets:
  existingSecret: ""
  jwtSecretKey: auth-jwt-secret          # -> HODEI_SECURITY__AUTH_JWT_SECRET
  metadataSignerKey: metadata-signer-armor # -> HODEI_METADATA_SIGNER_ARMOR

# Signing keys of the Terraform mirror archive URLs. The secrets live in an
# existing Secret (never inline): each entry names the key id and the key of the
# Secret that holds its secret (>= 32 bytes, e.g. `openssl rand -hex 32`). The
# first key signs, all of them verify; give every replica the same Secret.
# Without `existingSecret` no key is configured and the mirror fails closed (it
# issues no archive URLs, and a Terraform client cannot install from it).
#
#   kubectl create secret generic hodei-signing --from-literal=signing-key="$(openssl rand -hex 32)"
signing:
  existingSecret: ""
  ttlSecs: 300
  keys:
    - id: primary
      secretKey: signing-key

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# UID/GID 10001 matches the OCI image (Containerfile).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hodei.example.invalid
      path: /
      pathType: Prefix
  tls: []

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# Probes use the distinct contracts of HSP-237.
probes:
  startup: {path: /health/live, failureThreshold: 30, periodSeconds: 2}
  liveness: {path: /health/live, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
  readiness: {path: /health/ready, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}

terminationGracePeriodSeconds: 30
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# PodDisruptionBudget of the stateless API.
pdb:
  enabled: true
  minAvailable: 1

# In-cluster Garage S3 (optional).
garage:
  enabled: false
  image:
    repository: docker.io/dxflrs/garage
    tag: v2.1.0
    pullPolicy: IfNotPresent
  replicas: 1
  # Replication factor must not exceed the number of replicas.
  replicationFactor: 1
  zone: dc1
  # Layout capacity advertised to the cluster, e.g. 50G.
  capacity: 50G
  # Existing Secret holding rpc-secret and admin-token, plus the S3 key pair
  # imported by the bootstrap Job (keys are named under s3.* above when
  # s3.existingSecret is the same Secret).
  existingSecret: ""
  rpcSecretKey: rpc-secret
  adminTokenKey: admin-token
  # Two separate RWO volumes per replica: meta (small, low latency) and data.
  persistence:
    meta: {storageClass: "", size: 5Gi, accessModes: [ReadWriteOnce]}
    data: {storageClass: "", size: 100Gi, accessModes: [ReadWriteOnce]}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests: {cpu: 100m, memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  bootstrap:
    enabled: true
    # Needs a POSIX shell and curl; the Garage image has neither.
    image:
      repository: docker.io/curlimages/curl
      tag: 8.11.1
      pullPolicy: IfNotPresent
    backoffLimit: 6
    ttlSecondsAfterFinished: 3600
    # Display name of the imported key.
    keyName: hodei-artifacts

# In-cluster Dgraph Zero/Alpha (optional; the API wires itself to the Alpha).
dgraph:
  enabled: false
  image:
    repository: docker.io/dgraph/dgraph
    tag: v25.5.1
    digest: sha256:f7459f391921c94db78f8205de9b4624210e2396c6b4ef5736838a906a38becb
    pullPolicy: IfNotPresent
  # Zero is a single replica; Alpha needs --replicas wiring beyond one.
  alpha:
    replicas: 1
    persistence: {storageClass: "", size: 50Gi, accessModes: [ReadWriteOnce]}
    resources:
      requests: {cpu: 250m, memory: 1Gi}
  zero:
    persistence: {storageClass: "", size: 10Gi, accessModes: [ReadWriteOnce]}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
  # Existing Secret with the ACL HMAC secret (key below, >= 32 bytes).
  aclSecret: ""
  aclSecretKey: hmac-secret
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
