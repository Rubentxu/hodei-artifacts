# Baseline configuration.
#
# This is the file the service reads when no other source overrides it:
# `config/default.toml` has the lowest precedence among the files, below
# `config/{RUN_MODE}.toml` and `config/local.toml`, and every
# `HODEI_<SECTION>__<KEY>` environment variable still wins over all of them.
#
# It is also the file the released distribution ships, so that the extracted
# package boots on its own. A distribution without a readable configuration
# does not start at all: the configuration is deserialized strictly, and a
# missing `db_type` is an error rather than a silent default.

[server]
host = "127.0.0.1"
port = 3000
request_timeout_secs = 30
max_body_size = 10485760  # 10MB

[database]
db_type = "rocksdb"
namespace = "hodei"
database = "artifacts"
pool_size = 10

[rocksdb]
path = "./data/hodei.rocksdb"
create_if_missing = true
compression = true
max_open_files = 1000
write_buffer_size = 67108864  # 64MB

[schema]
# The IAM schema is registered on startup, so a fresh instance validates
# policies against a schema instead of degrading to a syntax check.
register_iam_on_startup = true
validate = true
storage_type = "rocksdb"

[security]
# The administrative /api/v1 surface stays closed unless an authenticator and
# authorizer are injected; every request still needs a bearer and Cedar permit.
admin_api_enabled = false
# The raw content surface (/repository/{repository}/{path}) stays closed unless
# it is explicitly enabled. A bundle that does not declare the UploadAsset
# and DownloadAsset actions cannot grant them, and the service refuses to
# start with a bundle that does not declare what it authorizes with.
raw_api_enabled = false
# Production bundle: set all five together or bootstrap fails closed.
# auth_jwt_secret = ""
# auth_jwks_path = "config/jwks.json"
# auth_issuer = "https://issuer.example"
# auth_audience = "hodei-artifacts"
# authorization_policy_path = "config/examples/policies.cedar"
# authorization_schema_path = "config/examples/schema.json"
# Empty means no cross-origin access. List explicit origins; '*' is rejected.
cors_allowed_origins = []

[logging]
level = "info"
format = "pretty"
include_timestamps = true
include_location = false

[content]
# Where the bytes of the artifacts live, addressed by digest. It is a
# decision of the deployment, not of the account.
cas_path = "./data/hodei.cas"
# How old an interrupted upload may be before the store cleans it up. A
# process that dies mid-upload leaves its staging file behind: that file is
# never published, but it is a file. The age is generous on purpose, and it
# has a floor of one minute: below that it stops being a margin of prudence.
# What protects a live upload is not the age but the lock: while the write
# is in progress its file is locked by the process that writes it, and a
# locked file is not removed.
staging_max_age_secs = 3600

[proxy]
# The hosts the service may reach on behalf of a proxy repository. Empty means
# the service reaches nothing: a proxy repository cannot resolve until an
# operator allows its upstream here. An entry is a host (and optionally a
# port), written as "host[:port][;private][;http]" or, in a file, as
# { host = "repo.example.com", port = 443 }. "private" opens loopback and
# private networks for that entry; "http" admits plain http. Link-local
# (cloud metadata), multicast and reserved ranges are never reachable.
allowed_hosts = []
# The environment variables a repository may name in credential_ref
# ("env:NAME"). Empty means no credential is ever sent to an upstream.
allowed_credentials = []
connect_timeout_secs = 5
# The whole resolution, redirects and body included.
total_timeout_secs = 300
# The most bytes one upstream response may carry. A repository can narrow it.
max_bytes = 1073741824
# The upstream fetches in flight at once; the next one answers 503.
max_concurrent = 8
# Offline mode: the service reaches no upstream. A proxy repository serves only
# the content it already holds with a receipt, and any other path fails with an
# explicit 503. A repository can go offline by itself with proxy.cache.offline;
# this switch is the operator's and wins.
offline = false
