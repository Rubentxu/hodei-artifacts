# Baseline configuration.
#
# This is the file the service reads when no other source overrides it:
# `config/default.toml` has the lowest precedence among the files, below
# `config/{RUN_MODE}.toml` and `config/local.toml`, and every
# `HODEI_<SECTION>__<KEY>` environment variable still wins over all of them.
#
# It is also the file the released distribution ships, so that the extracted
# package boots on its own. A distribution without a readable configuration
# does not start at all: the configuration is deserialized strictly, and a
# missing `db_type` is an error rather than a silent default.

[server]
host = "127.0.0.1"
port = 3000
request_timeout_secs = 30
max_body_size = 10485760  # 10MB

[database]
db_type = "rocksdb"
namespace = "hodei"
database = "artifacts"
pool_size = 10

[rocksdb]
path = "./data/hodei.rocksdb"
create_if_missing = true
compression = true
max_open_files = 1000
write_buffer_size = 67108864  # 64MB

[schema]
# The IAM schema is registered on startup, so a fresh instance validates
# policies against a schema instead of degrading to a syntax check.
register_iam_on_startup = true
validate = true
storage_type = "rocksdb"

[logging]
level = "info"
format = "pretty"
include_timestamps = true
include_location = false
