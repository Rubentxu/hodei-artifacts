[server]
host = "127.0.0.1"
port = 3000
request_timeout_secs = 30
max_body_size = 10485760  # 10MB

[database]
db_type = "rocksdb"
namespace = "hodei"
database = "artifacts"
pool_size = 10

[rocksdb]
path = "./data/hodei.development.rocksdb"
create_if_missing = true
compression = true
max_open_files = 1000
write_buffer_size = 67108864  # 64MB

[schema]
register_iam_on_startup = false
validate = true
storage_type = "rocksdb"

[security]
# The administrative /api/v1 surface stays closed unless an authenticator and
# authorizer are injected; every request still needs a bearer and Cedar permit.
admin_api_enabled = false
# Production bundle: set all five together or bootstrap fails closed.
# auth_jwt_secret = ""
# auth_jwks_path = "config/jwks.json"
# auth_issuer = "https://issuer.example"
# auth_audience = "hodei-artifacts"
# authorization_policy_path = "config/examples/policies.cedar"
# authorization_schema_path = "config/examples/schema.json"
# Empty means no cross-origin access. List explicit origins; '*' is rejected.
cors_allowed_origins = []

[logging]
level = "debug"
format = "pretty"
include_timestamps = true
include_location = false
