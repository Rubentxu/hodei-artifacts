# Standalone container profile (RUN_MODE=standalone).
#
# Uses embedded RocksDB for metadata and local filesystem CAS under /app/data,
# designed to run with a read-only rootfs and a writable /app/data volume.
# No secrets or tokens are baked into this profile.

[server]
host = "0.0.0.0"
port = 3000
request_timeout_secs = 30
max_body_size = 10485760

[database]
db_type = "rocksdb"
namespace = "hodei"
database = "artifacts"
pool_size = 10

[rocksdb]
path = "/app/data/hodei.rocksdb"
create_if_missing = true
compression = true
max_open_files = 1000
write_buffer_size = 67108864

[schema]
register_iam_on_startup = false
validate = true
storage_type = "rocksdb"

[security]
admin_api_enabled = false
raw_api_enabled = false
cors_allowed_origins = []

[logging]
level = "info"
format = "json"
include_timestamps = true
include_location = false

[repository]
durable = true

[content]
cas_path = "/app/data/hodei.cas"
staging_max_age_secs = 3600
backend = "filesystem"
