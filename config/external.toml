# External Dgraph/S3 container profile (RUN_MODE=external).
#
# Declares external Dgraph metadata and S3-compatible object storage.
# Fails closed when the configured backend is not supported or unreachable,
# without ever touching local RocksDB or filesystem CAS paths.
# Credentials are never stored in this file; provide them via environment
# variables or IAM/workload identity at runtime.

[server]
host = "0.0.0.0"
port = 3000
request_timeout_secs = 30
max_body_size = 10485760

[database]
db_type = "dgraph"
namespace = "hodei"
database = "artifacts"
pool_size = 10

[schema]
register_iam_on_startup = false
validate = true
storage_type = "dgraph"

[security]
admin_api_enabled = false
raw_api_enabled = false
cors_allowed_origins = []

[logging]
level = "info"
format = "json"
include_timestamps = true
include_location = false

[repository]
durable = true

[content]
backend = "s3"

[content.s3]
bucket = "hodei-content"
endpoint = "127.0.0.1:4566"
region = "eu-west-1"
tls = false
