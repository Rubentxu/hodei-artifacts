[package]
name = "hodei-export-tool"
version = "0.1.0"
edition = "2024"
description = "La herramienta one-shot de export semantico portable del registro: lotes paginados con manifiesto SHA256."
license = "MIT"

[dependencies]
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# El suelo de este crate es 2.7, como el del adaptador del catalogo: el
# manifiesto declara la version de contrato contra la que se produjo el
# export. La paginacion lee un rango de record id (`SELECT * FROM
# tabla:'ultimo'>.. LIMIT n`): en 2.7 el planner lo resuelve con `Iterate
# Range` acotado y el limite empujado al escaneo (tests/hsp179_keyset_plan.rs).
# El predicado `WHERE id > $x ORDER BY id` NO hace seek en 2.7 y no se usa.
surrealdb = { version = "2.7.0", features = ["kv-mem", "kv-rocksdb"] }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
hodei-catalog-storage = { path = "../hodei-catalog-storage" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
