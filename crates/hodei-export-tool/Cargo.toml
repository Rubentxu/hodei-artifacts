[package]
name = "hodei-export-tool"
version = "0.1.0"
edition = "2024"
description = "La herramienta one-shot de export semantico portable del registro: lotes paginados con manifiesto SHA256."
license = "MIT"

[dependencies]
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# El suelo de este crate es 2.7, como el del adaptador del catalogo: el
# manifiesto declara la version de contrato contra la que se produjo el
# export, y la garantia de que la lectura paginada por clave es ordenada
# se midio en 2.7.
surrealdb = { version = "2.7.0", features = ["kv-mem", "kv-rocksdb"] }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
hodei-catalog-storage = { path = "../hodei-catalog-storage" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
