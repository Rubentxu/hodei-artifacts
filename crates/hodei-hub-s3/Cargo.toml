[package]
name = "hodei-hub-s3"
version = "0.1.0"
edition = "2024"
description = "El backend S3-compatible del almacen de contenido de Hodei."
license = "MIT"

[dependencies]
async-trait = { workspace = true }
aws-config = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
base64 = { workspace = true }
hodei-evidence = { path = "../hodei-evidence" }
hodei-hub = { path = "../hodei-hub" }
md-5 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
md-5 = { workspace = true }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
futures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
