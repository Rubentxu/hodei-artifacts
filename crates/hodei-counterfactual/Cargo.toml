[package]
name = "hodei-counterfactual"
version = "0.1.0"
edition = "2024"
description = "La investigacion contrafactual de Hodei: explicar sin ejecutar."
license = "MIT"

[dependencies]
chrono = { workspace = true }
hodei-investigator = { path = "../hodei-investigator" }
hodei-simulation = { path = "../hodei-simulation" }
hodei-trust-policy = { path = "../hodei-trust-policy" }
kernel = { path = "../kernel" }
serde = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
hodei-evidence = { path = "../hodei-evidence" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
