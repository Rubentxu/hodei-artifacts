[package]
name = "hodei-graph-client"
version = "0.1.0"
edition = "2024"
description = "Minimal async Dgraph v25 client: TLS, ACL login, readiness and one DQL query, driven by explicit configuration."
license = "MIT"

[dependencies]
async-trait = { workspace = true }
prost = "=0.13.5"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
tonic = { version = "=0.13.1", default-features = false, features = [
    "channel",
    "codegen",
    "prost",
    "tls-ring",
] }
tracing = { workspace = true }

[build-dependencies]
tonic-build = "=0.13.1"

[dev-dependencies]
tracing-subscriber = { workspace = true }
