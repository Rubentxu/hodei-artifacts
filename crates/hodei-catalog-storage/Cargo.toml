[package]
name = "hodei-catalog-storage"
version = "0.1.0"
edition = "2024"
description = "El adaptador SurrealDB del catalogo de artefactos de Hodei."
license = "MIT"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
# El contrato de auditoría: el evento, el sink y el puerto del outbox. El
# dominio del catálogo no lo necesita, porque no sabe lo que es un evento
# de auditoría; el adaptador sí, porque escribe la fila del outbox dentro
# de la transacción que publica.
hodei-audit = { path = "../hodei-audit" }
hodei-catalog = { path = "../hodei-catalog" }
hodei-evidence = { path = "../hodei-evidence" }
# The engine of the Dgraph port: the authenticated client, the guarded
# write (scope guard + once-only operation) and the additive schema boot.
hodei-graph-client = { path = "../hodei-graph-client" }
hex = { workspace = true }
sha2 = { workspace = true }
kernel = { path = "../kernel" }
serde = { workspace = true }
serde_json = { workspace = true }
# El suelo de este crate es 2.7, no el del workspace: la garantia de que
# dos escritores concurrentes del mismo registro se arbitran entre si
# depende del motor persistente, y eso se midio en 2.7. Con un motor
# anterior, el perdedor no se pierde: el ultimo gana en silencio.
surrealdb = { version = "2.7.0", features = ["kv-mem", "kv-rocksdb"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# El aviso de que un evento de auditoría no se pudo escribir: perder el
# rastro no puede cambiar la respuesta del cliente, pero tampoco puede
# callarse.
tracing = { workspace = true }

[features]
default = ["legacy"]
legacy = ["dep:surrealdb"]

# La medicion de la busqueda escribe en el motor embebido.
[[bin]]
name = "search_benchmark"
required-features = ["legacy"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The measurement of the search seeds a hundred thousand assets in a
# test database: it needs a directory to throw away when it is done.
tempfile = { workspace = true }
