[package]
name = "hodei-catalog-storage"
version = "0.1.0"
edition = "2024"
description = "El adaptador SurrealDB del catalogo de artefactos de Hodei."
license = "MIT"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
hodei-catalog = { path = "../hodei-catalog" }
hodei-evidence = { path = "../hodei-evidence" }
kernel = { path = "../kernel" }
serde = { workspace = true }
serde_json = { workspace = true }
# El suelo de este crate es 2.7, no el del workspace: la garantia de que
# dos escritores concurrentes del mismo registro se arbitran entre si
# depende del motor persistente, y eso se midio en 2.7. Con un motor
# anterior, el perdedor no se pierde: el ultimo gana en silencio.
surrealdb = { version = "2.7.0", features = ["kv-mem", "kv-rocksdb"] }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
