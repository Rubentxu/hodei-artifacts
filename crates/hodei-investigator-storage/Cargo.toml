[package]
name = "hodei-investigator-storage"
version = "0.1.0"
edition = "2024"
description = "Los adaptadores del investigador de Hodei sobre el grafo y la evidencia reales."
license = "MIT"

[dependencies]
async-trait = { workspace = true }
hodei-evidence = { path = "../hodei-evidence" }
# HSP-213: sin el feature legacy del almacen de evidencia tampoco existe su
# lector embebido, asi que el corte se propaga.
hodei-evidence-storage = { path = "../hodei-evidence-storage", default-features = false }
hodei-investigator = { path = "../hodei-investigator" }
kernel = { path = "../kernel" }
surrealdb = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
default = ["legacy"]
legacy = ["dep:surrealdb", "hodei-evidence-storage/legacy"]

[dev-dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
hodei-graph-client = { path = "../hodei-graph-client" }
hodei-trust-policy = { path = "../hodei-trust-policy" }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
