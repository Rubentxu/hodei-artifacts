[package]
name = "hodei-catalog"
version = "0.1.0"
edition = "2024"
description = "El catalogo de artefactos de Hodei: repositorios, assets, versiones y referencias."
license = "MIT"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
hodei-evidence = { path = "../hodei-evidence" }
kernel = { path = "../kernel" }
serde = { workspace = true }
semver = "1.0"
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# El nuspec viaja comprimido dentro del nupkg: aqui si hacen falta los
# codecs, a diferencia de los fixtures stored del workspace.
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
flate2 = "1.1.11"
# dpkg comprime el `control.tar` en xz por defecto: sin liblzma no hay
# paquete real que se pueda indexar.
xz2 = "0.1"
sha2 = { workspace = true }
