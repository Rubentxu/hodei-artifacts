# Self-contained stack on the Dgraph profile: Dgraph Zero+Alpha (ACL on), a
# single-node Garage S3 and the API (HSP-314 F2).
#
# The API starts with RUN_MODE=dgraph, the productive profile: `[graph]`
# declares the Alpha as the single metadata authority and the bytes live in
# Garage. It never configures RocksDB or local filesystem CAS paths, and it
# contains no hardcoded credentials (provide them through the environment /
# `.env`). The API fails closed when the Alpha or the object store are
# unreachable. For an API-only deployment against your own Dgraph and S3, use
# compose.yaml.
#
# Operator steps outside this file: generate the ACL HMAC secret file
# (HODEI_DGRAPH_HMAC_SECRET_FILE), and create the Garage layout, the bucket and
# the access key (`garage layout`, `garage bucket create`, `garage key create`)
# whose values go in AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. The Alpha's
# guardian account (groot) ships with Dgraph's default password: change it and
# put the new one in HODEI_GRAPH__CREDENTIALS__PASSWORD.
#
# Not wired yet (HSP-314 F3): the investigation surface, the risk facts and the
# CVE reactor have no Dgraph wiring, so they stay closed on this profile.

name: hodei-artifacts-external

services:
  dgraph-zero:
    image: ${DGRAPH_IMAGE:-docker.io/dgraph/dgraph:v25.5.1@sha256:f7459f391921c94db78f8205de9b4624210e2396c6b4ef5736838a906a38becb}
    hostname: dgraph-zero
    restart: unless-stopped
    command: dgraph zero --my=dgraph-zero:5080 --wal=/dgraph-data/zero --telemetry "reports=false"
    volumes:
      - dgraph-zero-data:/dgraph-data
    networks:
      - hodei-external

  dgraph-alpha:
    image: ${DGRAPH_IMAGE:-docker.io/dgraph/dgraph:v25.5.1@sha256:f7459f391921c94db78f8205de9b4624210e2396c6b4ef5736838a906a38becb}
    hostname: dgraph-alpha
    restart: unless-stopped
    depends_on:
      - dgraph-zero
    command: >
      dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080
      --postings=/dgraph-data/p --wal=/dgraph-data/w
      --acl "secret-file=/dgraph/secrets/hmac-secret; access-ttl=24h; refresh-ttl=72h; jwt-alg=HS256"
      --telemetry "reports=false"
    ports:
      - "${HODEI_BIND_ADDR:-127.0.0.1}:${DGRAPH_ALPHA_HTTP_PORT:-8080}:8080"
      - "${HODEI_BIND_ADDR:-127.0.0.1}:${DGRAPH_ALPHA_GRPC_PORT:-9080}:9080"
    volumes:
      - dgraph-alpha-data:/dgraph-data
      - dgraph-backups:/dgraph-backups
      # `z` relabels the secret for SELinux hosts.
      - ${HODEI_DGRAPH_HMAC_SECRET_FILE:?set HODEI_DGRAPH_HMAC_SECRET_FILE to a file with the ACL HMAC secret (openssl rand -hex 32)}:/dgraph/secrets/hmac-secret:ro,z
    networks:
      - hodei-external

  garage:
    image: ${GARAGE_IMAGE:-docker.io/dxflrs/garage:v1.0.1}
    hostname: garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    ports:
      - "${HODEI_BIND_ADDR:-127.0.0.1}:${GARAGE_S3_PORT:-3900}:3900"
      - "${HODEI_BIND_ADDR:-127.0.0.1}:${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - hodei-external

  hodei-artifacts-api:
    image: ${HODEI_IMAGE:-localhost/hodei-artifacts-api:latest}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - dgraph-alpha
      - garage
    ports:
      - "${HODEI_BIND_ADDR:-127.0.0.1}:${HODEI_PORT:-3000}:3000"
    volumes:
      # The secret that signs the archive URLs of the Terraform mirror: a file
      # the operator generates (`openssl rand -hex 32`), mounted read-only.
      - ${HODEI_SIGNING_KEY_FILE:?set HODEI_SIGNING_KEY_FILE to a file with the signing secret (openssl rand -hex 32)}:/run/secrets/hodei-signing-key:ro
    environment:
      RUN_MODE: dgraph
      HODEI_GRAPH__ENDPOINT: dgraph-alpha:9080
      # The Alpha is on the private compose network: plaintext inside it.
      HODEI_GRAPH__TLS__ENABLED: "false"
      HODEI_GRAPH__TLS__CA_CERT_PATH: ""
      HODEI_GRAPH__TLS__SERVER_NAME: ""
      HODEI_GRAPH__NAMESPACE: ${HODEI_GRAPH__NAMESPACE:-0}
      HODEI_GRAPH__CREDENTIALS__USERID: ${HODEI_GRAPH__CREDENTIALS__USERID:-groot}
      HODEI_GRAPH__CREDENTIALS__PASSWORD: ${HODEI_GRAPH__CREDENTIALS__PASSWORD:?set HODEI_GRAPH__CREDENTIALS__PASSWORD (the ACL password of the service account)}
      HODEI_CONTENT__BACKEND: s3
      HODEI_CONTENT__S3__BUCKET: ${HODEI_CONTENT__S3__BUCKET:-hodei-content}
      HODEI_CONTENT__S3__ENDPOINT: ${HODEI_CONTENT__S3__ENDPOINT:-garage:3900}
      HODEI_CONTENT__S3__REGION: ${HODEI_CONTENT__S3__REGION:-garage}
      HODEI_CONTENT__S3__TLS: ${HODEI_CONTENT__S3__TLS:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      HODEI_SERVER__REQUEST_TIMEOUT_SECS: ${HODEI_SERVER__REQUEST_TIMEOUT_SECS:-30}
      HODEI_SERVER__MAX_BODY_SIZE: ${HODEI_SERVER__MAX_BODY_SIZE:-10485760}
      HODEI_LOGGING__LEVEL: ${HODEI_LOGGING__LEVEL:-info}
      HODEI_LOGGING__FORMAT: ${HODEI_LOGGING__FORMAT:-json}
      HODEI_LOGGING__INCLUDE_TIMESTAMPS: ${HODEI_LOGGING__INCLUDE_TIMESTAMPS:-true}
      HODEI_LOGGING__INCLUDE_LOCATION: ${HODEI_LOGGING__INCLUDE_LOCATION:-false}
      HODEI_SECURITY__ADMIN_API_ENABLED: ${HODEI_SECURITY__ADMIN_API_ENABLED:-false}
      HODEI_SECURITY__RAW_API_ENABLED: ${HODEI_SECURITY__RAW_API_ENABLED:-false}
      HODEI_SECURITY__OCI_API_ENABLED: ${HODEI_SECURITY__OCI_API_ENABLED:-false}
      HODEI_SIGNING__KEYS__0__ID: ${HODEI_SIGNING_KEY_ID:-primary}
      HODEI_SIGNING__KEYS__0__SECRET_FILE: /run/secrets/hodei-signing-key
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hodei-external

networks:
  hodei-external:
    driver: bridge

volumes:
  dgraph-zero-data:
  dgraph-alpha-data:
  dgraph-backups:
  garage-meta:
  garage-data:
