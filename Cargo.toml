[workspace]
# The active workspace: the shared kernel, the IAM and policy bounded
# contexts, and the API that composes them.
#
# The root crate (.) is the API binary and library; it is not a stub. The
# crates listed under `exclude` live in the tree but are not part of the
# build: they are a previous generation that does not compile against the
# current kernel, and pretending they are members would make the workspace
# fail to load. Their status and the reason for keeping them are in
# ARCHITECTURE_STATUS.md.
members = [
    "crates/kernel",
    "crates/hodei-iam",
    "crates/hodei-policies",
    "crates/hodei-evidence",
    "crates/hodei-evidence-storage",
    "crates/hodei-trust-policy",
    "crates/hodei-trust-policy-storage",
    "crates/hodei-risk",
    "crates/hodei-risk-storage",
    "crates/hodei-reachability",
    "crates/hodei-reachability-storage",
    "crates/hodei-reactive",
    "crates/hodei-hub",
    "crates/hodei-catalog",
    "crates/hodei-catalog-storage",
    "crates/hodei-audit",
    "crates/hodei-investigator",
    "crates/hodei-investigator-storage",
    "crates/hodei-simulation",
    "crates/hodei-simulation-storage",
    "crates/hodei-counterfactual",
    "crates/hodei-hub-s3",
    "crates/hodei-spike-ladybug",
    ".",
]
exclude = [
    "crates/artifact",
    "crates/distribution",
    "crates/hodei-authorizer",
    "crates/hodei-organizations",
    "crates/policies",
    "crates/repository",
    "crates/search",
    "crates/security",
    "crates/supply-chain",
]
resolver = "2"


# Optimización de profiles para tests rápidos
[profile.dev]
opt-level = 0
# Solo tablas de lineas: da trazas con numero de linea y evita la
# informacion de depuracion completa, que se paga en memoria y tiempo en
# cada uno de los muchos binarios de test que se enlazan.
debug = "line-tables-only"
split-debuginfo = "unpacked"  # Faster linking on Linux
incremental = true

# El calculo del digest es aritmetica pura: no aporta nada depurar y si
# compila optimizado aunque el resto del perfil sea de depuracion. Sin
# esto, hashear un blob de 1 GiB tarda minutos en un build de desarrollo.
[profile.dev.package.sha2]
opt-level = 3

[profile.test]
inherits = "dev"
opt-level = 0

# Profile optimizado para desarrollo con tests rápidos
[profile.dev-fast]
inherits = "dev"
opt-level = 1  # Optimización mínima para balance velocidad/debug
debug = true
incremental = true

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
# The published authorization core; no path/git dependency to a sibling
# checkout. The canonical identity of an action lives here, so every crate
# that needs it names the same version.
hodei-authz = "=0.1.2"

# Core async & runtime
tokio = { version = "^1.47", features = ["full"] }
async-trait = { version = "0.1.89" }
futures = { version = "0.3" }
futures-util = { version = "0.3" }
tokio-util = { version = "0.7" }

# Serialization / data
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
bincode = "1.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
chrono = { version = "^0.4", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

# Crypto / security
ring = "^0.17"
sha2 = { version = "^0.10" }
md-5 = "0.10"
sha1 = "0.10"
ed25519-dalek = "2.0"
pgp = "0.17"
rand = "0.8"
jsonwebtoken = "^9.3"

# HTTP / networking
axum = { version = "0.8.6", features = ["macros", "multipart"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "timeout", "compression-br"] }

# OpenAPI / Swagger
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }


lapin = "3.6.0"
surrealdb = { version = "2.3.9", features = ["kv-mem", "kv-rocksdb"] }

# Configuration management
config = "0.14"
dotenvy = "0.15"

# Testing utilities
tempfile = "3.10"


# Policy / authorization engine
cedar-policy = "4.5.1"

# Containers / testing
testcontainers = { version = "0.25.0" }
testcontainers-modules = { version = "0.13.0" }

# Misc utilities
anyhow = { version = "^1.0" }
thiserror = { version = "2.0.17" }
tracing = { version = "^0.1" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
base64 = "^0.22"
bytes = "1"
hex = "0.4"
mime = "0.3"
wiremock = "0.6.5"
mockall = "0.13.1"
bollard = "0.19.2"
regex = "1.0"
metrics = "0.24.1"

# Additional utilities
url = "2.5.0"
tracing-test = "0.2.5"
http = "1.1.0"
infer = "0.19.0"

[package]
name = "hodei-artifacts-api"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false
description = "Hodei Artifacts Graph-First API: Cedar authorization evaluation over HRN identities"



[dependencies]
kernel = { path = "crates/kernel" }
hodei-iam = { path = "crates/hodei-iam" }
hodei-policies = { path = "crates/hodei-policies" }
# The adapters of the evidence context: the operator command that declares
# the indexes of the graph needs to know which ones the graph needs.
hodei-evidence-storage = { path = "crates/hodei-evidence-storage" }
hodei-evidence = { path = "crates/hodei-evidence" }
# El contrato de auditoría: el evento, el sink, el outbox y el dispatcher.
# Lo usan el catálogo y la aplicación, y por eso vive en un crate y no en
# uno de los dos.
hodei-audit = { path = "crates/hodei-audit" }
# El catálogo: el contrato de repositorios, assets y versiones, y su
# adaptador sobre el motor. La superficie de contenido crudo los usa.
hodei-catalog = { path = "crates/hodei-catalog" }
hodei-catalog-storage = { path = "crates/hodei-catalog-storage" }
# La promocion al canal trusted: el servicio que decide con la politica de
# confianza y el almacen duradero de sus decisiones.
hodei-trust-policy = { path = "crates/hodei-trust-policy" }
hodei-trust-policy-storage = { path = "crates/hodei-trust-policy-storage" }
# El almacén de contenido por digest: el CAS donde viven los bytes.
hodei-hub = { path = "crates/hodei-hub" }
# El investigador: el dominio de la explicacion con citas, y su
# recuperador sobre el grafo y la evidencia. La superficie de
# investigacion los sirve; no reescribe nada de lo que hacen.
hodei-investigator = { path = "crates/hodei-investigator" }
hodei-investigator-storage = { path = "crates/hodei-investigator-storage" }
# Published core; no path/git dependency to a sibling checkout.
hodei-authz = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time utilities
chrono = { workspace = true }
# El digest del contenido que se sube: el cliente puede declararlo y hay
# que poder compararlo con lo que llega.
sha2 = { workspace = true }
# La firma de metadata de sistemas (Release.gpg, repomd.xml.asc): OpenPGP
# con clave Ed25519, contrastada con gpgv en las pruebas.
pgp = { workspace = true }
rand = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
semver = "1.0"
uuid = { workspace = true }
jsonwebtoken = { workspace = true }

# Database
surrealdb = { workspace = true }

# Policy engine
cedar-policy = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# OpenAPI / Swagger
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Configuration
config = { workspace = true }
dotenvy = { workspace = true }

# The query of the distribution protocol, decoded.
url = { workspace = true }
# The basic credentials of the Docker token endpoint, decoded.
base64 = { workspace = true }
# The egress of the remote proxy. TLS goes through the system trust store
# (native-tls), so a private CA is trusted the way the operator already
# trusts it for the rest of the host.
reqwest = { workspace = true }
bytes = { workspace = true }

# Testing utilities
tempfile = { workspace = true }

[dev-dependencies]
hodei-hrn = "0.2.1"
# Los fixtures de PyPI (un wheel y un sdist) se construyen aqui: un zip y
# un tar con gzip, sin depender de una herramienta de Python. El zip va sin
# codecs: el fixture se escribe *stored*, que no necesita ninguno.
zip = { version = "3.0.0", default-features = false }
flate2 = "1.1.11"
# El contrato de OpenAPI se lee en las pruebas: una prueba que compara lo
# que el contrato declara con lo que la ruta sirve necesita leerlo, y no
# adivinarlo.
serde_yaml = "0.9"
