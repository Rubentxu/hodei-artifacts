[workspace]
# The active workspace: the shared kernel, the IAM and policy bounded
# contexts, and the API that composes them.
#
# The root crate (.) is the API binary and library; it is not a stub. The
# previous-generation crates that used to live under `exclude` were removed
# (HSP-314); see ARCHITECTURE_STATUS.md.
members = [
    "crates/kernel",
    "crates/hodei-iam",
    "crates/hodei-policies",
    "crates/hodei-evidence",
    "crates/hodei-evidence-storage",
    "crates/hodei-trust-policy",
    "crates/hodei-trust-policy-storage",
    "crates/hodei-risk",
    "crates/hodei-risk-storage",
    "crates/hodei-reachability",
    "crates/hodei-reachability-storage",
    "crates/hodei-reactive",
    "crates/hodei-hub",
    "crates/hodei-catalog",
    "crates/hodei-catalog-storage",
    "crates/hodei-audit",
    "crates/hodei-export-tool",
    "crates/hodei-investigator",
    "crates/hodei-investigator-storage",
    "crates/hodei-simulation",
    "crates/hodei-simulation-storage",
    "crates/hodei-counterfactual",
    "crates/hodei-hub-s3",
    "crates/hodei-spike-ladybug",
    "crates/hodei-graph-client",
    ".",
]
resolver = "2"


# Optimización de profiles para tests rápidos
[profile.dev]
opt-level = 0
# Solo tablas de lineas: da trazas con numero de linea y evita la
# informacion de depuracion completa, que se paga en memoria y tiempo en
# cada uno de los muchos binarios de test que se enlazan.
debug = "line-tables-only"
split-debuginfo = "unpacked"  # Faster linking on Linux
incremental = true

# El calculo del digest es aritmetica pura: no aporta nada depurar y si
# compila optimizado aunque el resto del perfil sea de depuracion. Sin
# esto, hashear un blob de 1 GiB tarda minutos en un build de desarrollo.
[profile.dev.package.sha2]
opt-level = 3

[profile.test]
inherits = "dev"
opt-level = 0

# Profile optimizado para desarrollo con tests rápidos
[profile.dev-fast]
inherits = "dev"
opt-level = 1  # Optimización mínima para balance velocidad/debug
debug = true
incremental = true

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
# The published authorization core; no path/git dependency to a sibling
# checkout. The canonical identity of an action lives here, so every crate
# that needs it names the same version.
hodei-authz = "=0.1.2"

# Core async & runtime
tokio = { version = "^1.47", features = ["full"] }
async-trait = { version = "0.1.89" }
futures = { version = "0.3" }
futures-util = { version = "0.3" }
tokio-util = { version = "0.7" }

# Serialization / data
serde = { version = "^1.0", features = ["derive", "rc"] }
serde_json = { version = "^1.0" }
bincode = "1.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
chrono = { version = "^0.4", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

# Crypto / security
ring = "^0.17"
sha2 = { version = "^0.10" }
md-5 = "0.10"
sha1 = "0.10"
ed25519-dalek = "2.0"
pgp = "0.17"
rand = "0.8"
jsonwebtoken = "^9.3"

# HTTP / networking
axum = { version = "0.8.6", features = ["macros", "multipart"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "timeout", "compression-br"] }

# OpenAPI / Swagger
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }


lapin = "3.6.0"
surrealdb = { version = "2.3.9", features = ["kv-mem", "kv-rocksdb"] }

# Configuration management
config = "0.14"
dotenvy = "0.15"

# Testing utilities
tempfile = "3.10"


# Policy / authorization engine
cedar-policy = "4.5.1"

# Containers / testing
testcontainers = { version = "0.25.0" }
testcontainers-modules = { version = "0.13.0" }

# Misc utilities
anyhow = { version = "^1.0" }
thiserror = { version = "2.0.17" }
tracing = { version = "^0.1" }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
base64 = "^0.22"
bytes = "1"
hex = "0.4"
mime = "0.3"
wiremock = "0.6.5"
mockall = "0.13.1"
bollard = "0.19.2"
regex = "1.0"
metrics = "0.24.1"

# Additional utilities
url = "2.5.0"
tracing-test = "0.2.5"
http = "1.1.0"
infer = "0.19.0"

# HSP-213: el almacen embebido (SurrealDB sobre RocksDB) queda tras la
# feature `legacy`. HSP-314 F2: `legacy` ya NO es el defecto. El build por
# defecto es el perfil productivo: no enlaza ni surrealdb ni librocksdb, y
# un perfil sin `[graph]` se rechaza con el mensaje de migracion. Las
# suites historicas y las herramientas de legado (el motor embebido, hasta
# F4) se construyen con `--features legacy`; la etapa `legacy` de
# pipeline.kts las ejecuta.
[features]
default = []
legacy = [
    "dep:surrealdb",
    "hodei-iam/legacy",
    "hodei-evidence-storage/legacy",
    "hodei-investigator-storage/legacy",
    "hodei-risk-storage/legacy",
    "hodei-trust-policy-storage/legacy",
    "hodei-catalog-storage/legacy",
]
# Statically link OpenSSL for portable container/release binaries (e.g. Debian Bookworm).
vendored-openssl = ["dep:openssl"]

# Los comandos de legado hablan con el motor embebido: no existen en una
# construccion productiva.
[[bin]]
name = "ensure-iam-index"
path = "src/bin/ensure-iam-index.rs"
required-features = ["legacy"]

[[bin]]
name = "ensure-graph-index"
path = "src/bin/ensure-graph-index.rs"
required-features = ["legacy"]

[[bin]]
name = "backfill-iam-scope"
path = "src/bin/backfill-iam-scope.rs"
required-features = ["legacy"]

[[bin]]
name = "hodei-recovery"
path = "src/bin/hodei-recovery.rs"
required-features = ["legacy"]

[[bin]]
name = "perf_lab"
path = "src/bin/perf_lab.rs"
required-features = ["legacy"]

[package]
name = "hodei-artifacts-api"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/Rubentxu/hodei-artifacts"
description = "Hodei Artifacts Graph-First API: Cedar authorization evaluation over HRN identities"

# cargo-binstall resolves the prebuilt archive produced by
# scripts/package-release.sh: `<name>-<version>-<target>.tar.gz`, whose single
# top-level directory carries the binaries under `bin/`. Signature and SHA256
# verification is the job of scripts/install.sh; binstall fetches the same asset.
# HSP-314: the tarball carries `bin/hodei-artifacts-api` only. The legacy
# operator tools (ensure-iam-index, ensure-graph-index, backfill-iam-scope,
# hodei-recovery, perf_lab) are `required-features = ["legacy"]` and ship in
# scripts/package-legacy-tools.sh's own archive, never in this one.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-{ version }-{ target }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"



[dependencies]
kernel = { path = "crates/kernel" }
hodei-iam = { path = "crates/hodei-iam", default-features = false }
hodei-policies = { path = "crates/hodei-policies" }
# The adapters of the evidence context: the operator command that declares
# the indexes of the graph needs to know which ones the graph needs.
hodei-evidence-storage = { path = "crates/hodei-evidence-storage", default-features = false }
hodei-evidence = { path = "crates/hodei-evidence" }
# El contrato de auditoría: el evento, el sink, el outbox y el dispatcher.
# Lo usan el catálogo y la aplicación, y por eso vive en un crate y no en
# uno de los dos.
hodei-audit = { path = "crates/hodei-audit" }
# El catálogo: el contrato de repositorios, assets y versiones, y su
# adaptador sobre el motor. La superficie de contenido crudo los usa.
hodei-catalog = { path = "crates/hodei-catalog" }
hodei-catalog-storage = { path = "crates/hodei-catalog-storage", default-features = false }
# La promocion al canal trusted: el servicio que decide con la politica de
# confianza y el almacen duradero de sus decisiones.
hodei-trust-policy = { path = "crates/hodei-trust-policy" }
hodei-trust-policy-storage = { path = "crates/hodei-trust-policy-storage", default-features = false }
# Los hechos de riesgo de la promocion: la lectura del grafo de impacto.
hodei-risk-storage = { path = "crates/hodei-risk-storage", default-features = false }
# El cliente del grafo: el ledger durable de cuota arbitra sus reservas con
# el mecanismo de guardas G06 que vive aqui.
hodei-graph-client = { path = "crates/hodei-graph-client" }
# El dominio del riesgo (lectura OSV, proyeccion al grafo) y el motor
# reactivo firmado (intents, outbox, executor): el ciclo CVE -> reevalua-
# cion -> bloqueo se cablea en el arranque sobre ellos, sin motor nuevo
# (HSP-137).
hodei-risk = { path = "crates/hodei-risk" }
hodei-reactive = { path = "crates/hodei-reactive" }
# El almacén de contenido por digest: el CAS donde viven los bytes.
hodei-hub = { path = "crates/hodei-hub" }
# El mismo almacén sobre un object store S3-compatible: el backend que
# el arranque productivo elige por configuracion (HAE-05). El SDK va
# aqui porque es bootstrap quien construye el cliente con la cadena de
# credenciales del entorno.
hodei-hub-s3 = { path = "crates/hodei-hub-s3" }
aws-config = "1"
aws-sdk-s3 = "1"
# El investigador: el dominio de la explicacion con citas, y su
# recuperador sobre el grafo y la evidencia. La superficie de
# investigacion los sirve; no reescribe nada de lo que hacen.
hodei-investigator = { path = "crates/hodei-investigator" }
hodei-investigator-storage = { path = "crates/hodei-investigator-storage", default-features = false }
# Published core; no path/git dependency to a sibling checkout.
hodei-authz = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time utilities
chrono = { workspace = true }
# El digest del contenido que se sube: el cliente puede declararlo y hay
# que poder compararlo con lo que llega.
sha2 = { workspace = true }
# El indice `primary` de yum se sirve gzip: createrepo lo comprime y
# dnf exige el open-checksum del texto sin comprimir.
flate2 = "1.1.11"
# La firma de metadata de sistemas (Release.gpg, repomd.xml.asc): OpenPGP
# con clave Ed25519, contrastada con gpgv en las pruebas.
pgp = { workspace = true }
rand = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
semver = "1.0"
uuid = { workspace = true }
jsonwebtoken = { workspace = true }

# Database
surrealdb = { workspace = true, optional = true }

# Policy engine
cedar-policy = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# OpenAPI / Swagger
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Configuration
config = { workspace = true }
dotenvy = { workspace = true }

# The query of the distribution protocol, decoded.
url = { workspace = true }
# HMAC-SHA256 of the signed URLs, verified in constant time.
ring = { workspace = true }
# posix_fadvise and fsync of the performance lab: the cold scene drops the
# pages of the content from the page cache without root (HSP-140).
libc = "0.2"
# The basic credentials of the Docker token endpoint, decoded.
base64 = { workspace = true }
# The egress of the remote proxy. TLS goes through the system trust store
# (native-tls), so a private CA is trusted the way the operator already
# trusts it for the rest of the host.
reqwest = { workspace = true }
bytes = { workspace = true }

# Testing utilities
tempfile = { workspace = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
tonic = { version = "=0.13.1", default-features = false }
hodei-hrn = "0.2.1"
# Las pruebas de arranque sobre S3 observan el cubo desde fuera del
# servicio, con credenciales fijas de LocalStack: el tipo de credenciales
# del SDK, no un proveedor de produccion.
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
# Los fixtures de PyPI (un wheel y un sdist) se construyen aqui: un zip y
# un tar con gzip, sin depender de una herramienta de Python. El zip va sin
# codecs: el fixture se escribe *stored*, que no necesita ninguno.
zip = { version = "3.0.0", default-features = false }
flate2 = "1.1.11"
# El contrato de OpenAPI se lee en las pruebas: una prueba que compara lo
# que el contrato declara con lo que la ruta sirve necesita leerlo, y no
# adivinarlo.
serde_yaml = "0.9"
# El IT del catálogo Dgraph (HSP-187) abre el motor de verdad: el cliente
# autenticado y la guarda versionada viven aquí.
hodei-graph-client = { path = "crates/hodei-graph-client" }

# HSP-314 F4 S3: IT de catalogo y formatos sobre Dgraph real. Compilan y
# corren con `--no-default-features` (sin `legacy`): la referencia de paridad
# del motor embebido se sustituyo por aserciones directas del contrato. Se
# saltan a si mismos (exit 0) sin HODEI_GRAPH_IT_ENDPOINT.

[[test]]
name = "hsp187_catalog_dgraph_it"
path = "tests/hsp187_catalog_dgraph_it.rs"

[[test]]
name = "hsp190_oci_catalog_dgraph_it"
path = "tests/hsp190_oci_catalog_dgraph_it.rs"

[[test]]
